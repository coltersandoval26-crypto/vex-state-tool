<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEX Skills Calculator — What do I need to rank up?</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07090f;
  --surface: #0e1218;
  --card: #131820;
  --border: #1e2a3a;
  --accent: #00d4ff;
  --gold: #f0b429;
  --text: #e2e8f0;
  --muted: #64748b;
  --muted2: #94a3b8;
  --font-head: 'Barlow Condensed', sans-serif;
  --font-body: 'Barlow', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100vh;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse 80% 50% at 10% 0%, rgba(0,180,255,.07) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: linear-gradient(rgba(0,212,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(0,212,255,.025) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
  z-index: 0;
}

.wrap { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 48px 20px 80px; }

.hero { text-align: center; margin-bottom: 52px; }
.hero-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--accent);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 16px;
  display: inline-block;
  background: rgba(0,212,255,.07);
  border: 1px solid rgba(0,212,255,.2);
  border-radius: 20px;
  padding: 4px 14px;
}
.hero h1 {
  font-family: var(--font-head);
  font-size: clamp(48px, 9vw, 88px);
  font-weight: 900;
  line-height: .95;
  letter-spacing: -1px;
  margin-bottom: 18px;
}
.hero h1 .line1 { color: var(--text); display: block; }
.hero h1 .line2 { color: var(--accent); display: block; }
.hero p {
  font-size: 16px;
  color: var(--muted2);
  max-width: 520px;
  margin: 0 auto;
  line-height: 1.7;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px;
  margin-bottom: 20px;
}
.card-title {
  font-family: var(--font-head);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
@media(max-width:560px){ .form-grid { grid-template-columns: 1fr; } }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label {
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--muted2);
  text-transform: uppercase;
  letter-spacing: .5px;
}
.field input, .field select {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 11px 14px;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 13px;
  outline: none;
  transition: border-color .15s;
}
.field input:focus, .field select:focus { border-color: var(--accent); }
.field input::placeholder { color: var(--muted); }
.field select { cursor: pointer; }

.btn {
  background: linear-gradient(135deg, var(--accent), #0099cc);
  border: none;
  border-radius: 8px;
  color: #000;
  font-family: var(--font-head);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 12px 24px;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
  width: 100%;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(0,212,255,.3); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

.status {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-family: var(--font-mono);
  margin-top: 16px;
}
.status.show { display: flex; }
.status.error { background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.2); color: #ef4444; }

.results { display: none; margin-top: 32px; }
.results.show { display: block; }

.result-header {
  font-family: var(--font-head);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 16px;
}

.target-banner {
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 4px solid var(--gold);
  border-radius: 12px;
  padding: 20px 24px;
  margin-bottom: 24px;
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
  align-items: center;
}

.banner-stat { display: flex; flex-direction: column; gap: 4px; }
.banner-label { font-size: 10px; font-family: var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.banner-val { font-family: var(--font-head); font-size: 32px; font-weight: 900; line-height: 1; color: var(--text); }
.banner-val.gold { color: var(--gold); }
.banner-val.accent { color: var(--accent); }
.banner-divider { width: 1px; height: 40px; background: var(--border); }

.need-box {
  margin-left: auto;
  background: rgba(240,180,41,.08);
  border: 1px solid rgba(240,180,41,.25);
  border-radius: 10px;
  padding: 12px 20px;
  text-align: center;
  min-width: 140px;
}
.need-val { font-family: var(--font-head); font-size: 40px; font-weight: 900; color: var(--gold); line-height: 1; }
.need-label { font-size: 10px; font-family: var(--font-mono); color: var(--gold); text-transform: uppercase; letter-spacing: .5px; margin-top: 4px; }

.table-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  margin-top: 24px;
}
.table-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  font-family: var(--font-head);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--accent);
}

table { width: 100%; border-collapse: collapse; }
thead th {
  background: var(--surface);
  padding: 12px 16px;
  text-align: left;
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--muted2);
  text-transform: uppercase;
  letter-spacing: .5px;
  font-weight: 500;
  border-bottom: 1px solid var(--border);
}
thead th.r { text-align: right; }

tbody td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}
tbody td.r { text-align: right; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: rgba(0,212,255,.03); }

.row-you    { background: rgba(0,212,255,.08) !important; }
.row-target { background: rgba(240,180,41,.06) !important; }
.row-threat { background: rgba(239,68,68,.05) !important; }

.rank-num { font-family: var(--font-head); font-size: 18px; font-weight: 700; color: var(--text); }
.team-code { font-family: var(--font-mono); font-weight: 600; font-size: 13px; }
.score-total { font-family: var(--font-head); font-size: 18px; font-weight: 700; }
.score-part { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

.tag { 
  display: inline-block;
  font-size: 9px;
  font-family: var(--font-mono);
  padding: 2px 6px;
  border-radius: 4px;
  margin-left: 6px;
  font-weight: 600;
}
.tag-you    { background: rgba(0,212,255,.15); color: var(--accent); border: 1px solid rgba(0,212,255,.3); }
.tag-target { background: rgba(240,180,41,.15); color: var(--gold); border: 1px solid rgba(240,180,41,.3); }
</style>
</head>
<body>

<div class="wrap">
  <div class="hero">
    <div class="hero-eyebrow">VEX V5RC SKILLS</div>
    <h1>
      <span class="line1">WHAT SCORE DO I</span>
      <span class="line2">NEED TO RANK UP?</span>
    </h1>
    <p>Calculate your target skills score to reach any rank in your state.</p>
  </div>

  <div class="card">
    <div class="card-title">Calculator</div>
    
    <div class="form-grid">
      <div class="field">
        <label>Team Number</label>
        <input type="text" id="teamNum" placeholder="74074Y" maxlength="10">
      </div>
      <div class="field">
        <label>Target Rank</label>
        <input type="number" id="targetRank" placeholder="10" min="1">
      </div>
    </div>

    <div class="field" style="margin-bottom:16px">
      <label>State / Region</label>
      <select id="state">
        <option value="">Select your state...</option>
      </select>
    </div>

    <button class="btn" onclick="calculate()">Calculate Target Score</button>
    
    <div class="status" id="status">
      <span id="statusMsg"></span>
    </div>
  </div>

  <div class="results" id="results">
    <div class="result-header" id="resultsTitle"></div>

    <div class="target-banner" id="targetBanner"></div>

    <div class="table-wrap">
      <div class="table-header">Full Leaderboard</div>
      <table>
        <thead>
          <tr>
            <th style="width:60px">State #</th>
            <th style="width:60px">Global #</th>
            <th style="width:120px">Team</th>
            <th class="r">Total</th>
            <th class="r">Auton</th>
            <th class="r">Driver</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
let allTeams = [];
let stateMap = {};

// Load CSV on page load
Papa.parse('skills-standings.csv', {
  download: true,
  header: true,
  complete: function(results) {
    allTeams = results.data
      .filter(row => row['Team Number'] && row['Score'])
      .map(row => ({
        globalRank: parseInt(row['Rank']),
        rank: parseInt(row['Rank']),
        team: row['Team Number'].trim(),
        name: row['Team Name'],
        total: parseInt(row['Score']),
        auton: parseInt(row['Autonomous Coding Skills']),
        driver: parseInt(row['Driver Skills']),
        state: row['Event Region']
      }));
    
    // Build state list
    const states = new Set(allTeams.map(t => t.state).filter(Boolean));
    const select = document.getElementById('state');
    Array.from(states).sort().forEach(state => {
      const opt = document.createElement('option');
      opt.value = state;
      opt.textContent = state;
      select.appendChild(opt);
    });
    
    // Build state map for filtering
    allTeams.forEach(t => {
      if (!stateMap[t.state]) stateMap[t.state] = [];
      stateMap[t.state].push(t);
    });
  }
});

function setStatus(msg) {
  const bar = document.getElementById('status');
  bar.className = 'status show error';
  document.getElementById('statusMsg').textContent = msg;
}

function calculate() {
  const teamNum = document.getElementById('teamNum').value.trim().toUpperCase();
  const targetRank = parseInt(document.getElementById('targetRank').value);
  const state = document.getElementById('state').value;

  if (!targetRank) { setStatus('Enter target rank'); return; }
  if (!state) { setStatus('Select your state'); return; }

  const stateTeams = (stateMap[state] || [])
    .sort((a, b) => b.total - a.total || b.auton - a.auton)
    .map((t, i) => ({ ...t, rank: i + 1, globalRank: t.globalRank }));

  if (stateTeams.length === 0) {
    setStatus('No teams found for ' + state);
    return;
  }

  const you = stateTeams.find(t => t.team === teamNum);
  const target = stateTeams[targetRank - 1];
  const needed = target ? Math.max(0, target.total + 1 - (you?.total || 0)) : 0;

  // Build banner
  let bannerHTML = '';
  if (you) {
    bannerHTML += `<div class="banner-stat"><div class="banner-label">Your Rank</div><div class="banner-val accent">#${you.rank}</div></div>`;
    bannerHTML += `<div class="banner-stat"><div class="banner-label">Your Score</div><div class="banner-val">${you.total}</div></div>`;
    bannerHTML += `<div class="banner-divider"></div>`;
  }
  bannerHTML += `<div class="banner-stat"><div class="banner-label">Target Rank</div><div class="banner-val">#${targetRank}</div></div>`;
  if (target) {
    bannerHTML += `<div class="banner-stat"><div class="banner-label">Target Score</div><div class="banner-val">${target.total}</div></div>`;
  }
  bannerHTML += `<div class="need-box"><div class="need-val">${needed > 0 ? '+' + needed : '✓'}</div><div class="need-label">${needed > 0 ? 'Points Needed' : 'Already There!'}</div></div>`;

  document.getElementById('targetBanner').innerHTML = bannerHTML;
  document.getElementById('resultsTitle').textContent = state + ' Skills';

  // Build table
  const tableHTML = stateTeams.map(t => {
    let rowClass = '';
    let tags = '';
    if (t.team === teamNum) {
      rowClass = 'row-you';
      tags = '<span class="tag tag-you">YOU</span>';
    } else if (t.rank === targetRank) {
      rowClass = 'row-target';
      tags = '<span class="tag tag-target">TARGET</span>';
    } else if (you && you.rank > targetRank && t.rank > targetRank && t.rank < you.rank) {
      rowClass = 'row-threat';
    }

    return `
      <tr class="${rowClass}">
        <td><span class="rank-num">${t.rank}</span></td>
        <td><span class="rank-num" style="color:var(--muted2);font-size:14px">${t.globalRank}</span></td>
        <td><span class="team-code">${t.team}</span>${tags}</td>
        <td class="r"><span class="score-total">${t.total}</span></td>
        <td class="r"><span class="score-part">${t.auton}</span></td>
        <td class="r"><span class="score-part">${t.driver}</span></td>
      </tr>
    `;
  }).join('');

  document.getElementById('tableBody').innerHTML = tableHTML;
  document.getElementById('status').className = 'status';
  document.getElementById('results').className = 'results show';
  document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
</script>

</body>
</html>
