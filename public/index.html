<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEX Skills Calculator — What score do I need?</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #07090f;
  --surface: #0e1218;
  --card:    #131820;
  --border:  #1e2a3a;
  --accent:  #00d4ff;
  --gold:    #f0b429;
  --green:   #22c55e;
  --red:     #ef4444;
  --text:    #e2e8f0;
  --muted:   #64748b;
  --muted2:  #94a3b8;
  --fh: 'Barlow Condensed', sans-serif;
  --fb: 'Barlow', sans-serif;
  --fm: 'JetBrains Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--fb); min-height: 100vh; }
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(ellipse 80% 50% at 10% 0%, rgba(0,180,255,.07) 0%, transparent 60%);
}
body::after {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: linear-gradient(rgba(0,212,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.025) 1px,transparent 1px);
  background-size: 48px 48px;
}
.wrap { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 48px 20px 80px; }

/* Hero */
.hero { text-align: center; margin-bottom: 48px; }
.eyebrow {
  font-family: var(--fm); font-size: 11px; color: var(--accent); letter-spacing: 3px;
  text-transform: uppercase; margin-bottom: 16px; display: inline-block;
  background: rgba(0,212,255,.07); border: 1px solid rgba(0,212,255,.2);
  border-radius: 20px; padding: 4px 14px;
}
.hero h1 {
  font-family: var(--fh); font-size: clamp(44px,9vw,84px); font-weight: 900;
  line-height: .95; letter-spacing: -1px; margin-bottom: 16px;
}
.hero h1 .l1 { color: var(--text); display: block; }
.hero h1 .l2 { color: var(--accent); display: block; }
.hero p { font-size: 15px; color: var(--muted2); max-width: 480px; margin: 0 auto; line-height: 1.7; }

/* Card */
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 16px; padding: 28px; margin-bottom: 20px;
}
.card-title {
  font-family: var(--fh); font-size: 12px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase; color: var(--accent);
  margin-bottom: 20px; display: flex; align-items: center; gap: 8px;
}
.card-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* Form */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
@media(max-width:540px) { .grid2 { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 10px; font-family: var(--fm); color: var(--muted2); text-transform: uppercase; letter-spacing: .5px; }
.field input, .field select {
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 13px; color: var(--text); font-family: var(--fm); font-size: 13px;
  outline: none; transition: border-color .15s;
}
.field input:focus, .field select:focus { border-color: var(--accent); }
.field input::placeholder { color: var(--muted); }

/* Grade toggle */
.toggle { display: flex; gap: 8px; margin-bottom: 18px; }
.tbtn {
  flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px; font-family: var(--fh); font-size: 13px; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase; color: var(--muted2); cursor: pointer; transition: all .15s;
}
.tbtn:hover { border-color: var(--accent); color: var(--text); }
.tbtn.on { background: linear-gradient(135deg, var(--accent), #0099cc); border-color: var(--accent); color: #000; }

/* Button */
.btn {
  background: linear-gradient(135deg, var(--accent), #0099cc); border: none;
  border-radius: 8px; color: #000; font-family: var(--fh); font-size: 15px;
  font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
  padding: 13px 24px; cursor: pointer; width: 100%; transition: transform .15s, box-shadow .15s;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(0,212,255,.3); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

/* Status bar */
.status {
  display: none; align-items: center; gap: 8px; padding: 12px 16px;
  border-radius: 8px; font-size: 12px; font-family: var(--fm); margin-top: 14px;
}
.status.show  { display: flex; }
.status.load  { background: rgba(0,212,255,.08); border: 1px solid rgba(0,212,255,.2); color: var(--accent); }
.status.ok    { background: rgba(34,197,94,.08);  border: 1px solid rgba(34,197,94,.2);  color: var(--green); }
.status.err   { background: rgba(239,68,68,.08);  border: 1px solid rgba(239,68,68,.2);  color: var(--red); }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 13px; height: 13px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; flex-shrink: 0; }

/* Results */
.results { display: none; margin-top: 28px; }
.results.show { display: block; }
.result-hd { font-family: var(--fh); font-size: 17px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); margin-bottom: 14px; }

/* Banner */
.banner {
  background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--gold);
  border-radius: 12px; padding: 20px 24px; margin-bottom: 20px;
  display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start;
}
.bstat { display: flex; flex-direction: column; gap: 4px; }
.blbl  { font-size: 10px; font-family: var(--fm); color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.bval  { font-family: var(--fh); font-size: 30px; font-weight: 900; line-height: 1; color: var(--text); }
.bval.ac { color: var(--accent); }
.bval.gd { color: var(--gold); }
.bdiv   { width: 1px; height: 40px; background: var(--border); align-self: center; }
.needbox {
  margin-left: auto; background: rgba(240,180,41,.08); border: 1px solid rgba(240,180,41,.25);
  border-radius: 10px; padding: 12px 20px; text-align: center; min-width: 130px;
}
.needval { font-family: var(--fh); font-size: 38px; font-weight: 900; color: var(--gold); line-height: 1; }
.needlbl { font-size: 10px; font-family: var(--fm); color: var(--gold); text-transform: uppercase; letter-spacing: .5px; margin-top: 3px; }
.plan-tips { width: 100%; margin-top: 6px; font-size: 12px; color: var(--muted2); line-height: 1.7; }
.plan-tips span { display: block; }
.plan-tips span::before { content: '›  '; color: var(--accent); }

/* Search bar */
.search-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
.search-row input {
  flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 9px 13px; color: var(--text); font-family: var(--fm); font-size: 12px; outline: none;
}
.search-row input:focus { border-color: var(--accent); }
.count-lbl { font-family: var(--fm); font-size: 11px; color: var(--muted); white-space: nowrap; }

/* Table */
.table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.table-hd { padding: 14px 18px; border-bottom: 1px solid var(--border); font-family: var(--fh); font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); }
table { width: 100%; border-collapse: collapse; }
thead th {
  background: var(--surface); padding: 10px 14px; text-align: left;
  font-size: 10px; font-family: var(--fm); color: var(--muted2);
  text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid var(--border);
}
thead th.r { text-align: right; }
tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border); font-size: 14px; }
tbody td.r { text-align: right; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: rgba(0,212,255,.03); }
.row-you    { background: rgba(0,212,255,.09) !important; }
.row-target { background: rgba(240,180,41,.07) !important; }
.row-threat { background: rgba(239,68,68,.05) !important; }
.rnum  { font-family: var(--fh); font-size: 17px; font-weight: 700; }
.tcode { font-family: var(--fm); font-size: 12px; font-weight: 600; }
.stotal { font-family: var(--fh); font-size: 17px; font-weight: 700; }
.spart  { font-family: var(--fm); font-size: 11px; color: var(--muted); }
.tag {
  display: inline-block; font-size: 9px; font-family: var(--fm);
  padding: 2px 5px; border-radius: 3px; margin-left: 5px; font-weight: 700; vertical-align: middle;
}
.tag-you    { background: rgba(0,212,255,.15); color: var(--accent); border: 1px solid rgba(0,212,255,.3); }
.tag-target { background: rgba(240,180,41,.15); color: var(--gold);   border: 1px solid rgba(240,180,41,.3); }

/* Pagination */
.pager { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
.pager button {
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  color: var(--muted2); font-family: var(--fm); font-size: 11px; padding: 6px 12px; cursor: pointer;
}
.pager button:disabled { opacity: .35; cursor: not-allowed; }
.pager button:not(:disabled):hover { border-color: var(--accent); color: var(--text); }
.pager-info { font-family: var(--fm); font-size: 11px; color: var(--muted); flex: 1; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="eyebrow">VEX V5RC SKILLS 2025–2026</div>
    <h1><span class="l1">WHAT SCORE DO I</span><span class="l2">NEED TO RANK UP?</span></h1>
    <p>Real-time skills leaderboard data. Enter your state and target rank to see exactly what you need.</p>
  </div>

  <div class="card">
    <div class="card-title">Calculator</div>

    <div class="toggle" id="gradeToggle">
      <button class="tbtn on" onclick="setGrade('High School')">High School</button>
      <button class="tbtn"    onclick="setGrade('Middle School')">Middle School</button>
    </div>

    <div class="grid2">
      <div class="field">
        <label>Your Team Number (Optional)</label>
        <input id="teamQ" type="text" placeholder="1234A" maxlength="12">
      </div>
      <div class="field">
        <label>Target Rank</label>
        <input id="rankN" type="number" value="10" min="1" max="9999">
      </div>
    </div>
    <div class="grid2">
      <div class="field">
        <label>State / Region (Optional)</label>
        <input id="regionQ" type="text" placeholder="Oklahoma">
      </div>
      <div class="field">
        <label>Country (Optional)</label>
        <input id="countryQ" type="text" placeholder="United States">
      </div>
    </div>

    <button class="btn" id="calcBtn" onclick="calculate()">Calculate Target Score</button>

    <div class="status" id="status">
      <div class="spinner" id="spinner"></div>
      <span id="statusMsg"></span>
    </div>
  </div>

  <div class="results" id="results">
    <div class="result-hd" id="resultTitle"></div>
    <div class="banner" id="banner"></div>
    <div class="table-wrap">
      <div class="table-hd">Full Leaderboard</div>
      <div class="search-row" style="padding:10px 14px 0">
        <input id="tableSearch" type="text" placeholder="Filter by team number or name…" oninput="renderTable()">
        <span class="count-lbl" id="countLbl"></span>
      </div>
      <table>
        <thead><tr>
          <th style="width:56px">Rank</th>
          <th>Team</th>
          <th class="r">Total</th>
          <th class="r">Auton</th>
          <th class="r">Driver</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="pager">
        <button id="prevBtn" onclick="changePage(-1)" disabled>← Prev</button>
        <span class="pager-info" id="pagerInfo"></span>
        <button id="nextBtn" onclick="changePage(1)">Next →</button>
      </div>
    </div>
  </div>
</div>

<script>
let grade = 'High School';
let allTeams = [];
let youTeam = null;
let targetRank = 10;
let filteredTeams = [];
let page = 0;
const PAGE_SIZE = 50;

function setGrade(g) {
  grade = g;
  document.querySelectorAll('.tbtn').forEach(b => b.classList.toggle('on', b.textContent === g));
}

function setStatus(type, msg, showSpinner) {
  const bar = document.getElementById('status');
  bar.className = 'status show ' + type;
  document.getElementById('spinner').style.display = showSpinner ? 'block' : 'none';
  document.getElementById('statusMsg').textContent = msg;
}

async function calculate() {
  const team    = document.getElementById('teamQ').value.trim().toUpperCase() || null;
  const rank    = parseInt(document.getElementById('rankN').value) || 10;
  const region  = document.getElementById('regionQ').value.trim() || null;
  const country = document.getElementById('countryQ').value.trim() || null;

  targetRank = rank;

  document.getElementById('calcBtn').disabled = true;
  document.getElementById('results').className = 'results';
  setStatus('load', 'Fetching leaderboard…', true);

  try {
    const payload = { grade, region, country, team, rank };
    const res  = await fetch('/api/state', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'API error');

    const { you, target, plan, allTeams: teams, totalTeams, cached, filters } = data;

    allTeams = teams;
    youTeam  = you;

    // Banner
    let html = '';
    if (you) {
      html += `<div class="bstat"><div class="blbl">Your Rank</div><div class="bval ac">#${you.rank}</div></div>`;
      html += `<div class="bstat"><div class="blbl">Your Score</div><div class="bval">${you.total}</div></div>`;
      html += `<div class="bdiv"></div>`;
    }
    html += `<div class="bstat"><div class="blbl">Target Rank</div><div class="bval">#${rank}</div></div>`;
    if (target) html += `<div class="bstat"><div class="blbl">Target Score</div><div class="bval gd">${target.total}</div></div>`;

    const n = plan?.needed ?? 0;
    html += `<div class="needbox"><div class="needval">${n > 0 ? '+' + n : '✓'}</div><div class="needlbl">${n > 0 ? 'Points Needed' : 'Already There!'}</div></div>`;

    if (plan?.recommended?.length) {
      html += `<div class="plan-tips">${plan.recommended.map(s => `<span>${s}</span>`).join('')}</div>`;
    }
    document.getElementById('banner').innerHTML = html;

    const scopeParts = [filters?.grade, filters?.country, filters?.region].filter(Boolean);
    document.getElementById('resultTitle').textContent = scopeParts.join(' • ') || 'All Regions';

    page = 0;
    document.getElementById('tableSearch').value = '';
    renderTable();

    setStatus('ok', `✓ ${totalTeams} teams loaded${cached ? ' (cached)' : ''}`, false);
    setTimeout(() => { document.getElementById('status').className = 'status'; }, 4000);

    document.getElementById('results').className = 'results show';
    document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });

  } catch (err) {
    setStatus('err', err.message, false);
  }
  document.getElementById('calcBtn').disabled = false;
}

function renderTable() {
  const q = document.getElementById('tableSearch').value.trim().toUpperCase();
  filteredTeams = q
    ? allTeams.filter(t => t.team.includes(q) || t.teamName.toUpperCase().includes(q))
    : allTeams;

  const total = filteredTeams.length;
  const start = page * PAGE_SIZE;
  const slice = filteredTeams.slice(start, start + PAGE_SIZE);

  document.getElementById('countLbl').textContent = total !== allTeams.length
    ? `${total} of ${allTeams.length} teams` : `${allTeams.length} teams`;

  const rows = slice.map(t => {
    let cls = '', tags = '';
    if (youTeam && t.team === youTeam.team) {
      cls = 'row-you'; tags = '<span class="tag tag-you">YOU</span>';
    } else if (t.rank === targetRank) {
      cls = 'row-target'; tags = '<span class="tag tag-target">TARGET</span>';
    } else if (youTeam && youTeam.rank > targetRank && t.rank > targetRank && t.rank < youTeam.rank) {
      cls = 'row-threat';
    }
    return `<tr class="${cls}">
      <td><span class="rnum">${t.rank}</span></td>
      <td><span class="tcode">${t.team}</span>${tags}<br><span style="font-size:11px;color:var(--muted)">${t.teamName || ''}</span></td>
      <td class="r"><span class="stotal">${t.total}</span></td>
      <td class="r"><span class="spart">${t.auton}</span></td>
      <td class="r"><span class="spart">${t.driver}</span></td>
    </tr>`;
  }).join('');

  document.getElementById('tbody').innerHTML = rows || '<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--muted)">No teams found</td></tr>';

  const totalPages = Math.ceil(total / PAGE_SIZE);
  document.getElementById('pagerInfo').textContent = total > 0
    ? `Showing ${start + 1}–${Math.min(start + PAGE_SIZE, total)} of ${total}` : '';
  document.getElementById('prevBtn').disabled = page === 0;
  document.getElementById('nextBtn').disabled = page >= totalPages - 1;
}

function changePage(dir) {
  const totalPages = Math.ceil(filteredTeams.length / PAGE_SIZE);
  page = Math.max(0, Math.min(page + dir, totalPages - 1));
  renderTable();
  document.querySelector('.table-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
</script>
</body>
</html>
