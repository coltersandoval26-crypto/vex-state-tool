<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>VEX State Skills Calculator</title>
  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      padding: 20px;
    }
    input, button {
      width: 100%;
      padding: 8px;
      margin: 6px 0;
      font-size: 16px;
    }
    button {
      background: orange;
      border: none;
      cursor: pointer;
    }
    #output {
      margin-top: 20px;
      background: #222;
      padding: 15px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
<h2>VEX State Skills Calculator</h2>
<input id="team" placeholder="Team Number (ex: 74074Y)">
<input id="state" placeholder="State (ex: Oklahoma)">
<input id="rank" type="number" placeholder="Target Rank">
<input id="token" placeholder="RobotEvents API Token">
<button onclick="run()">Calculate</button>
<div id="output"></div>
<script>
async function run() {
  try {
    const team = document.getElementById("team").value.trim().toUpperCase();
    const state = document.getElementById("state").value.trim();
    const rank = document.getElementById("rank").value;
    const token = document.getElementById("token").value.trim();
    
    document.getElementById("output").textContent = "Loading...";
    
    const res = await fetch(`/api/state?team=${encodeURIComponent(team)}&state=${encodeURIComponent(state)}&rank=${rank}&token=${encodeURIComponent(token)}`);
    
    const data = await res.json();
    
    if (!res.ok) {
      document.getElementById("output").textContent = "ERROR " + res.status + ":\n" + JSON.stringify(data, null, 2);
      return;
    }
    
    document.getElementById("output").textContent = JSON.stringify(data, null, 2);
  } catch (err) {
    document.getElementById("output").textContent = "ERROR: " + err.message;
  }
}
</script>
</body>
</html>
