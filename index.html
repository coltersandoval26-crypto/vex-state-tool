<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEX State Tool</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .container {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 5px;
        }
        input, button {
            padding: 8px;
            margin: 5px 0;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 5px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>VEX State Tool</h1>
        
        <label for="teamNum">Team Number:</label>
        <input type="text" id="teamNum" placeholder="Enter team number">
        
        <label for="state">State:</label>
        <input type="text" id="state" placeholder="Enter state">
        
        <label for="targetRank">Target Rank:</label>
        <input type="number" id="targetRank" placeholder="Enter target rank">
        
        <label for="token">Token:</label>
        <input type="text" id="token" placeholder="Enter token">
        
        <label for="selectedGrade">Grade:</label>
        <input type="text" id="selectedGrade" placeholder="Enter grade">
        
        <button onclick="generateURL()">Generate URL</button>
        
        <div id="result"></div>
    </div>

    <script>
        function generateURL() {
            const teamNum = document.getElementById('teamNum').value;
            const state = document.getElementById('state').value;
            const targetRank = document.getElementById('targetRank').value;
            const token = document.getElementById('token').value;
            const selectedGrade = document.getElementById('selectedGrade').value;

            const url = `/api/state?team=${encodeURIComponent(teamNum)}&state=${encodeURIComponent(state)}&rank=${targetRank}&token=${encodeURIComponent(token)}&grade=${encodeURIComponent(selectedGrade)}`;
            
            document.getElementById('result').innerHTML = '<strong>Generated URL:</strong><br>' + url;
        }
    </script>
</body>
</html>
