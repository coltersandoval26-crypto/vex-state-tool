<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Leaderboard Calculator</title>
    <script>
        async function fetchLeaderboard() {
            try {
                const response = await fetch('https://api.example.com/team-leaderboard');
                const data = await response.json();
                displayLeaderboard(data);
            } catch (error) {
                console.error('Error fetching leaderboard:', error);
            }
        }

        function displayLeaderboard(data) {
            const leaderboardElement = document.getElementById('leaderboard');
            leaderboardElement.innerHTML = '';
            data.forEach(team => {
                const teamElement = document.createElement('div');
                teamElement.innerText = `${team.name}: ${team.score}`;
                leaderboardElement.appendChild(teamElement);
            });
        }

        window.onload = fetchLeaderboard;
    </script>
</head>
<body>
    <h1>Team Leaderboard</h1>
    <div id="leaderboard">
        <!-- Leaderboard will be displayed here -->
    </div>
</body>
</html>
